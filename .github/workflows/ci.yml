name: ci
on: [push, pull_request]
jobs:
  governance-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # governance-checks' adr-status diffs against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run governance convention checks
        # --layout enforces the two-plane rule continuously
        # (llm/governance/project-operating-system.md §Repository Areas)
        # instead of only at onboarding. This repo carries its own delta
        # (llm/governance/governance-delta.md), so the layout check is a real
        # assertion here and not a SKIP: the canon is verified against the
        # rule it publishes.
        run: node plugin/scripts/governance-checks.mjs --layout
      - name: Checker regression tests
        # The checker is the enforcement mechanism and had no tests until
        # v0.6.0, when it was found to be silently mis-binding the artifacts
        # slot and passing adr-index/adr-status on a nonexistent directory.
        run: node plugin/scripts/governance-checks.test.mjs
