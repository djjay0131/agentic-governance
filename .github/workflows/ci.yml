name: ci
on: [push, pull_request]
jobs:
  governance-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # governance-checks' adr-status diffs against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run governance convention checks
        # --layout enforces the two-plane rule continuously
        # (llm/governance/project-operating-system.md §Repository Areas)
        # instead of only at onboarding. This repo carries no delta of its
        # own yet, so the layout check reports a loud SKIP here rather than a
        # PASS; it turns into a real assertion the moment a delta declares
        # paths.
        run: node plugin/scripts/governance-checks.mjs --layout
